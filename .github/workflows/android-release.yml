name: Android Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Generate temporary CI keystore and sign release test APK
        shell: bash
        run: |
          set -euo pipefail
          # Temporary signature proves the APK signing flow. It is not a permanent app identity.
          STORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STORE_PASS"
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/nestnote-ci-release.jks" \
            -storetype JKS -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -alias nestnote-ci-release -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=NESTNOTE CI Release Test,O=Temporary Testing,C=US"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/nestnote-ci-release.jks" \
            --ks-key-alias nestnote-ci-release \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
            --out "NESTNOTE-${GITHUB_REF_NAME}-CI-SIGNED.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "NESTNOTE-${GITHUB_REF_NAME}-CI-SIGNED.apk"
          rm -f "$RUNNER_TEMP/nestnote-ci-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: NESTNOTE-${{ github.ref_name }}-CI-SIGNED
          path: NESTNOTE-${{ github.ref_name }}-CI-SIGNED.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "NESTNOTE-${GITHUB_REF_NAME}-CI-SIGNED.apk" --title "NESTNOTE ${GITHUB_REF_NAME}" --generate-notes
