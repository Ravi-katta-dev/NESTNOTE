name: Android Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Sign production release with permanent key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?SIGNING_KEY secret is required for tagged production releases}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required for tagged production releases}"
          : "${KEY_STORE_PASSWORD:?KEY_STORE_PASSWORD secret is required for tagged production releases}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required for tagged production releases}"
          KEYSTORE_PATH="$RUNNER_TEMP/nestnote-production.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          APK_NAME="NESTNOTE-$GITHUB_REF_NAME.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      - name: Upload unsigned release build for manual CI inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NESTNOTE-${{ github.sha }}-UNSIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Publish tagged production release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "NESTNOTE $GITHUB_REF_NAME" --generate-notes
