name: Android Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Sign production release with permanent key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?KEYSTORE_BASE64 secret is required for tagged production releases}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required for tagged production releases}"
          : "${KEY_STORE_PASSWORD:?KEYSTORE_PASSWORD secret is required for tagged production releases}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required for tagged production releases}"
          KEYSTORE_PATH="$RUNNER_TEMP/nestnote-production.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          # Ignore whitespace in the stored Base64 value, then fail clearly if it is malformed.
          if ! printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::KEYSTORE_BASE64 is not valid Base64. Re-encode the permanent keystore file and update this Actions secret."
            exit 1
          fi
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty."; exit 1; }
          APK_NAME="NESTNOTE-$GITHUB_REF_NAME.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      - name: Upload unsigned release build for manual CI inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NESTNOTE-${{ github.sha }}-UNSIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Publish tagged production release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing/adding the signed APK asset."
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "NESTNOTE $GITHUB_REF_NAME" --generate-notes
          fi
          # Verify that the published release now exposes the APK asset.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
