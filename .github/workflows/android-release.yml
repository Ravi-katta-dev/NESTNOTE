name: Android Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload this signed APK to (for example v1.0.6). Leave empty for a signed APK artifact only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign production APK with permanent key
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?KEYSTORE_BASE64 secret is required for production APK signing}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required for production APK signing}"
          : "${KEY_STORE_PASSWORD:?KEYSTORE_PASSWORD secret is required for production APK signing}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required for production APK signing}"

          KEYSTORE_PATH="$RUNNER_TEMP/nestnote-production.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          # Ignore whitespace in the stored Base64 value and fail clearly if it is malformed.
          if ! printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::KEYSTORE_BASE64 is not valid Base64. Re-encode the permanent keystore file and update this Actions secret."
            exit 1
          fi
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty."; exit 1; }

          RELEASE_TAG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [[ -n "$RELEASE_TAG_INPUT" ]]; then
            if [[ ! "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must use the format vMAJOR.MINOR.PATCH (for example v1.0.6)."
              exit 1
            fi
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            APK_NAME="NESTNOTE-$RELEASE_TAG.apk"
          else
            APK_NAME="NESTNOTE-${GITHUB_SHA:0:7}.apk"
          fi

          # Validate the permanent keystore and configured alias before signing.
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Upload signed APK as a workflow artifact
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NESTNOTE-signed-${{ github.sha }}
          path: NESTNOTE-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Repair latest versioned release missing its APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Only consider normal vMAJOR.MINOR.PATCH releases, newest first.
          TARGET_TAG=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            EXPECTED_APK="NESTNOTE-$tag.apk"
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$EXPECTED_APK"; then
              TARGET_TAG="$tag"
              break
            fi
          done < <(
            gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tagName'
          )

          if [[ -z "$TARGET_TAG" ]]; then
            echo "No published versioned release is missing its version-named APK; nothing to repair."
            exit 0
          fi

          # Safety gate: never attach a main build to an older tag if app/source files differ.
          if ! git merge-base --is-ancestor "$TARGET_TAG" "$GITHUB_SHA"; then
            echo "Skipping repair: release tag $TARGET_TAG is not an ancestor of this main commit."
            exit 0
          fi
          if ! git diff --quiet "$TARGET_TAG" "$GITHUB_SHA" -- . ':!.github/workflows/**'; then
            echo "Skipping repair: app or non-workflow source differs from release tag $TARGET_TAG."
            exit 0
          fi

          VERSIONED_APK="NESTNOTE-$TARGET_TAG.apk"
          cp "$APK_NAME" "$VERSIONED_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$VERSIONED_APK"
          echo "Repairing missing APK asset on existing release $TARGET_TAG."
          gh release upload "$TARGET_TAG" "$VERSIONED_APK" --clobber
          gh release view "$TARGET_TAG" --json assets --jq '.assets[].name' | grep -Fx "$VERSIONED_APK"

      - name: Publish signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TARGET_TAG="$GITHUB_REF_NAME"
          else
            TARGET_TAG="$RELEASE_TAG_INPUT"
          fi
          : "${TARGET_TAG:?A release tag is required to publish the APK}"

          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists; uploading/replacing its signed APK asset."
            gh release upload "$TARGET_TAG" "$APK_NAME" --clobber
          else
            echo "Release $TARGET_TAG does not exist; creating it with the signed APK."
            gh release create "$TARGET_TAG" "$APK_NAME" \
              --title "NESTNOTE $TARGET_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

          # Fail the workflow unless GitHub confirms the APK is attached to the target release.
          gh release view "$TARGET_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
