name: Android Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "NESTNOTE-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NESTNOTE-${{ github.ref_name }}
          path: NESTNOTE-${{ github.ref_name }}.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "NESTNOTE-${GITHUB_REF_NAME}.apk" --title "NESTNOTE ${GITHUB_REF_NAME}" --generate-notes
