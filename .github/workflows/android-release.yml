name: Android Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Generate temporary CI keystore and sign release test APK
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STORE_PASS"
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/nestnote-ci-release.jks" \
            -storetype JKS -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -alias nestnote-ci-release -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=NESTNOTE CI Release Test,O=Temporary Testing,C=US"
          APK_NAME="NESTNOTE-${GITHUB_SHA::7}-CI-SIGNED.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/nestnote-ci-release.jks" \
            --ks-key-alias nestnote-ci-release \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
            --out "$APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_NAME"
          rm -f "$RUNNER_TEMP/nestnote-ci-release.jks"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: NESTNOTE-${{ github.sha }}-CI-SIGNED
          path: NESTNOTE-${{ github.sha }}-CI-SIGNED.apk
          if-no-files-found: error
      - name: Publish automatic prerelease or tagged release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            gh release create "$RELEASE_TAG" "$APK_NAME" --title "NESTNOTE $RELEASE_TAG" --generate-notes
          else
            RELEASE_TAG="auto-${GITHUB_SHA::7}"
            gh release create "$RELEASE_TAG" "$APK_NAME" --title "NESTNOTE automatic build ${GITHUB_SHA::7}" --notes "Automated prerelease from main at commit $GITHUB_SHA." --prerelease
          fi
