name: PR Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: Require independent approval
    runs-on: ubuntu-latest
    steps:
      - name: Check approval for current commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          approvals="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews"             --jq "[.[] | select(.commit_id == \"$PR_HEAD_SHA\" and .user.login != \"$PR_AUTHOR\") | {user: .user.login, state: .state, submitted_at: .submitted_at}] | sort_by(.submitted_at) | group_by(.user) | map(last) | map(select(.state == \"APPROVED\")) | length")"

          if [ "$approvals" -lt 1 ]; then
            echo "::error::This pull request needs at least one approval from someone other than its author on the current head commit."
            echo "Request a review, then submit an approval after the latest commit. A new commit requires a fresh approval."
            exit 1
          fi

          echo "Found $approvals independent approval(s) for the current head commit."
