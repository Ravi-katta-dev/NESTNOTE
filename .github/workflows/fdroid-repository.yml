name: F-Droid Repository

on:
  workflow_dispatch:
  release:
    types: [published]

# The F-Droid signing key is separate from the Android APK signing key.
# Configure the F_DROID_* repository secrets before enabling publication.
permissions:
  contents: read

concurrency:
  group: fdroid-repository
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check required repository signing secrets
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.F_DROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.F_DROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FDROID_KEYSTORE_BASE64:?Configure F_DROID_KEYSTORE_BASE64}"
          : "${FDROID_KEYSTORE_PASSWORD:?Configure F_DROID_KEYSTORE_PASSWORD}"
          : "${FDROID_KEY_ALIAS:?Configure F_DROID_KEY_ALIAS}"
          : "${FDROID_KEY_PASSWORD:?Configure F_DROID_KEY_PASSWORD}"
          echo "Repository signing secrets are present (values are not printed)."

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install F-Droid server tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Prepare repository workspace
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.F_DROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.F_DROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo
          printf '%s' "$FDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/fdroid-repo-signing.jks"
          test -s "$RUNNER_TEMP/fdroid-repo-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/fdroid-repo-signing.jks" -storepass "$FDROID_KEYSTORE_PASSWORD" -alias "$FDROID_KEY_ALIAS" >/dev/null

          cat > fdroid/config.yml <<EOF
          repo_url: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/repo
          repo_name: NESTNOTE
          repo_description: Official NESTNOTE custom F-Droid repository.
          repo_icon: icon.png
          archive_older: 0
          repo_keyalias: "$FDROID_KEY_ALIAS"
          keystore: "$RUNNER_TEMP/fdroid-repo-signing.jks"
          keystorepass: "$FDROID_KEYSTORE_PASSWORD"
          keypass: "$FDROID_KEY_PASSWORD"
          EOF

          # Rebuild the index from every non-prerelease GitHub release asset,
          # so publishing a new version does not remove older installable versions.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,isDraft --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' > "$RUNNER_TEMP/release-tags.txt"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'NESTNOTE-v*.apk' --dir fdroid/repo || {
              echo "::warning::No matching production APK asset found for $tag"
            }
          done < "$RUNNER_TEMP/release-tags.txt"

          if ! compgen -G 'fdroid/repo/*.apk' >/dev/null; then
            echo "::error::No versioned production APKs found; publish a signed GitHub Release first."
            exit 1
          fi

          # Keep the keystore outside the published directory; never publish private keys.
          rm -f fdroid/repo/index.jar fdroid/repo/index-v1.jar fdroid/repo/index.xml
          cd fdroid
          fdroid update --create-metadata --pretty
          cd ..
          rm -f fdroid/repo/*.apk.idsig

      - name: Validate signed APKs and repository index
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.F_DROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -s fdroid/repo/index.jar
          test -s fdroid/repo/index-v1.jar
          unzip -t fdroid/repo/index.jar
          find fdroid/repo -maxdepth 1 -name 'NESTNOTE-v*.apk' -print -quit | grep -q .
          # Verify every published APK is signed; this does not replace the
          # independent production-certificate fingerprint check in the release checklist.
          for apk in fdroid/repo/NESTNOTE-v*.apk; do
            apksigner verify --verbose "$apk"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository site
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid

      - name: Deploy repository site
        id: deployment
        uses: actions/deploy-pages@v4
