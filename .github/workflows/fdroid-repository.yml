name: NESTNOTE F-Droid Repository

# Run only after the Android Release workflow finishes successfully.
on:
  workflow_call:
    inputs:
      release_tag:
        description: "Stable release tag created by Android Release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable GitHub Release tag to publish (for example v1.2.5)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fdroid-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::F-Droid publishing requires a stable tag like v1.2.5."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Validate release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::F-Droid publishing requires a release tag like v2.0.0."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/apk"
          gh release download "$RELEASE_TAG" --pattern "NESTNOTE-$RELEASE_TAG.apk" --dir "$RUNNER_TEMP/apk"
          test -s "$RUNNER_TEMP/apk/NESTNOTE-$RELEASE_TAG.apk"
          echo "APK_PATH=$RUNNER_TEMP/apk/NESTNOTE-$RELEASE_TAG.apk" >> "$GITHUB_ENV"

      - name: Install Android APK inspection tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Validate APK identity, version, and signing certificate
        env:
          FDROID_ALLOWED_APK_CERT_SHA256: ${{ secrets.FDROID_ALLOWED_APK_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FDROID_ALLOWED_APK_CERT_SHA256:?Add FDROID_ALLOWED_APK_CERT_SHA256 after independently verifying the production release certificate}"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK_PATH")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n1)"

          [[ "$PACKAGE_NAME" == "com.nestnote.app" ]] || { echo "::error::Unexpected APK application ID: $PACKAGE_NAME"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Could not read a numeric APK versionCode."; exit 1; }
          [[ "$VERSION_NAME" == "${RELEASE_TAG#v}" ]] || { echo "::error::APK versionName '$VERSION_NAME' does not match release tag '$RELEASE_TAG'."; exit 1; }

          "$APKSIGNER" verify --verbose "$APK_PATH"
          CERT_LINE="$("$APKSIGNER" verify --print-certs "$APK_PATH" | grep -m1 'Signer #1 certificate SHA-256 digest:')"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_LINE" | sed 's/.*: //' | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$FDROID_ALLOWED_APK_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::FDROID_ALLOWED_APK_CERT_SHA256 must be a SHA-256 certificate fingerprint."; exit 1; }
          [[ "$ACTUAL_CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::Release APK certificate does not match the pinned production certificate fingerprint."; exit 1; }

          echo "Validated APK package=$PACKAGE_NAME versionCode=$VERSION_CODE versionName=$VERSION_NAME and pinned signer fingerprint."
          echo "APK_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_CERT_SHA256=$ACTUAL_CERT_SHA256" >> "$GITHUB_ENV"

      - name: Install F-Droid server tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --break-system-packages --upgrade fdroidserver
          fdroid --version

      - name: Configure repository signing
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          : "${FDROID_KEYSTORE_BASE64:?Add FDROID_KEYSTORE_BASE64 repository secret}"
          : "${FDROID_KEYSTORE_PASS:?Add FDROID_KEYSTORE_PASS repository secret}"
          : "${FDROID_KEY_ALIAS:?Add FDROID_KEY_ALIAS repository secret}"
          : "${FDROID_KEY_PASS:?Add FDROID_KEY_PASS repository secret}"
          printf '%s' "$FDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > fdroid/keystore.p12
          test -s fdroid/keystore.p12
          FDROID_KEYSTORE_PASS="$FDROID_KEYSTORE_PASS" FDROID_KEY_ALIAS="$FDROID_KEY_ALIAS" FDROID_KEY_PASS="$FDROID_KEY_PASS" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("fdroid/config.yml")
          text = path.read_text()
          for placeholder, env_name in (
              ("${FDROID_KEY_ALIAS}", "FDROID_KEY_ALIAS"),
              ("${FDROID_KEYSTORE_PASS}", "FDROID_KEYSTORE_PASS"),
              ("${FDROID_KEY_PASS}", "FDROID_KEY_PASS"),
          ):
              text = text.replace(placeholder, os.environ[env_name])
          path.write_text(text)
          PY
          chmod 600 fdroid/keystore.p12

      - name: Prepare F-Droid metadata and repository
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("fdroid/metadata/com.nestnote.app.yml")
          text = path.read_text()
          text = "\n".join(
              line for line in text.splitlines()
              if not line.startswith("AllowedAPKSigningKeys:")
          ).rstrip()
          text += "\nAllowedAPKSigningKeys:\n  - " + os.environ["APK_CERT_SHA256"] + "\n"
          path.write_text(text)
          PY

          mkdir -p fdroid/repo
          APK_NAME="com.nestnote.app_${APK_VERSION_CODE}.apk"
          install -m 644 "$APK_PATH" "fdroid/repo/$APK_NAME"
          cd fdroid
          fdroid update --verbose
          test -s repo/index.jar || test -s repo/index-v1.jar
          test -s "repo/$APK_NAME"

      # Fetch the current website source independently of the release tag. A
      # release tag may predate the website, so deploy the current main version.
      - name: Check out GitHub Pages website source
        uses: actions/checkout@v4
        with:
          ref: main
          path: website-source
          persist-credentials: false

      - name: Assemble and publish complete GitHub Pages tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/fdroid-pages"
          mkdir -p "$PUBLISH_DIR/fdroid"

          # Publish the website at the Pages root and F-Droid below /fdroid/repo.
          for file in index.html styles.css app.js site.webmanifest; do
            test -s "website-source/$file" || {
              echo "::error::Required website file is missing: $file"
              exit 1
            }
            install -m 644 "website-source/$file" "$PUBLISH_DIR/$file"
          done
          test -d website-source/assets || {
            echo "::error::Website assets directory is missing."
            exit 1
          }
          cp -a website-source/assets "$PUBLISH_DIR/assets"
          touch "$PUBLISH_DIR/.nojekyll"

          # Preserve the F-Droid repository under its existing public path.
          cp -a fdroid/repo "$PUBLISH_DIR/fdroid/repo"
          test -s "$PUBLISH_DIR/fdroid/repo/index.jar" || test -s "$PUBLISH_DIR/fdroid/repo/index-v1.jar"

          rm -f fdroid/keystore.p12
          cd "$PUBLISH_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish website and F-Droid repository for $RELEASE_TAG"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:gh-pages

      - name: Verify published website is publicly readable
        shell: bash
        run: |
          set -euo pipefail
          SITE_BASE="https://ravi-katta-dev.github.io/NESTNOTE"
          for path in "/" "/styles.css" "/app.js" "/site.webmanifest" "/assets/nestnote-icon.svg"; do
            url="$SITE_BASE$path"
            output="$RUNNER_TEMP/pages-check"
            if [[ "$path" == "/" ]]; then
              output="$RUNNER_TEMP/pages-home.html"
            fi
            ok=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location "$url?verify=$GITHUB_RUN_ID-$attempt" -o "$output"; then
                ok=true
                break
              fi
              sleep 5
            done
            if [[ "$ok" != true ]]; then
              echo "::error::GitHub Pages website resource did not become publicly readable: $url"
              exit 1
            fi
          done
          grep -qi "NESTNOTE" "$RUNNER_TEMP/pages-home.html" || {
            echo "::error::Published homepage does not contain expected NESTNOTE content."
            exit 1
          }

      - name: Verify published repository is publicly readable
        run: |
          set -euo pipefail
          # Do not report a successful publish until the public index and APK
          # both expose the exact release that this run just published.
          INDEX_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/fdroid/repo/index-v2.json"
          APK_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/fdroid/repo/com.nestnote.app_${APK_VERSION_CODE}.apk"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$INDEX_URL?verify=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/index-v2.json" \
              && curl --fail --silent --show-error --location "$APK_URL?verify=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/published.apk"; then
              if python3 - "$RUNNER_TEMP/index-v2.json" "$APK_VERSION_CODE" "$RUNNER_TEMP/published.apk" "$APK_PATH" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          index_path, version_code, published_apk, source_apk = sys.argv[1:]
          index = json.loads(Path(index_path).read_text())
          versions = index["packages"]["com.nestnote.app"]["versions"]
          expected = str(version_code)
          if not any(str(item["manifest"].get("versionCode")) == expected
                     for item in versions.values()):
              raise SystemExit(f"Published index does not contain versionCode {expected}")
          published_hash = hashlib.sha256(Path(published_apk).read_bytes()).hexdigest()
          source_hash = hashlib.sha256(Path(source_apk).read_bytes()).hexdigest()
          if published_hash != source_hash:
              raise SystemExit("Public APK hash does not match the release APK")
          print(f"Verified public F-Droid index versionCode={expected} and APK SHA-256={published_hash}")
          PY
              then
                exit 0
              fi
            fi
            echo "Public repository has not propagated the expected APK/index yet (attempt $attempt/12)."
            sleep 10
          done
          echo "::error::F-Droid publication push succeeded, but the public index/APK did not become readable with the expected version."
          exit 1
