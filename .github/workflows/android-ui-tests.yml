name: Android Emulator UI Tests (ReactiveCircus)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ui-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  instrumentation-tests:
    name: Instrumentation and UI E2E tests on API 36
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator"
      - name: Run emulator UI tests with ReactiveCircus
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-36-instrumentation-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
