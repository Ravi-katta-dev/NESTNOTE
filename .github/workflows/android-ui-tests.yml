name: Android Emulator UI Tests (ReactiveCircus)
on:
  # Expensive emulator tests are manual-only; do not start any CI from PR updates.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose latest commit was approved
        required: true
        type: string
      expected_sha:
        description: Full 40-character PR head SHA approved by the repository owner
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: android-ui-tests-pr-${{ inputs.pr_number }}
  cancel-in-progress: true
jobs:
  instrumentation-tests:
    name: Instrumentation and UI E2E tests on API 36
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify approved PR head is still current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected SHA must be a full 40-character lowercase commit SHA"; exit 1; }
          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          ACTUAL_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<< "$PR_JSON")"
          [[ "$PR_STATE" == "open" && "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::PR is closed or approval is stale"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator"
      - name: Run emulator UI tests with ReactiveCircus
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -verbose -show-kernel
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p emulator-diagnostics
          adb devices -l > emulator-diagnostics/adb-devices.txt 2>&1 || true
          ps -ef | grep -E '[e]mulator|[q]emu|[a]db' > emulator-diagnostics/processes.txt || true
          for dir in "$HOME/.android/avd" /tmp "$ANDROID_HOME/emulator"; do
            if [[ -d "$dir" ]]; then
              find "$dir" -maxdepth 4 -type f \( -iname '*emulator*.log' -o -iname 'emu*.log' -o -iname '*crash*.log' \) -print -exec cp --parents {} emulator-diagnostics/ \; 2>/dev/null || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-36-instrumentation-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-diagnostics/
          if-no-files-found: ignore
