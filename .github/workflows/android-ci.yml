name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Serialize CI per ref. For PRs, a newer commit cancels the older debounce/run;
# the surviving run checks out the latest PR merge ref after the 5-minute window.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit tests, API 36 debug build and release compilation
    runs-on: ubuntu-latest
    steps:
      - name: Debounce pull request updates
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Waiting 5 minutes for a burst of pull request commits to settle."
          sleep 300
      - uses: actions/checkout@v4
        with:
          # For PRs, use the current merge ref after debounce so tests include
          # the latest PR commits merged with the current target branch.
          # Main pushes and manual runs use the triggering SHA as usual.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build minified release APK
        run: gradle --no-daemon assembleRelease
      - name: Compile Android instrumentation tests
        run: gradle --no-daemon assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload debug and release APK inspection artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk-inspection
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
