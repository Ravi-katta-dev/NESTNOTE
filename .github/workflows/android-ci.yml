name: Android CI
on:
  # CI is deliberately manual-only. The approval workflow dispatches it only after
  # the repository owner approves the exact current PR head SHA.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose latest commit was approved
        required: true
        type: string
      expected_sha:
        description: Full 40-character PR head SHA approved by the repository owner
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: android-ci-pr-${{ inputs.pr_number }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit tests, API 36 debug build and release compilation
    runs-on: ubuntu-latest
    steps:
      - name: Verify approval still matches the latest PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected SHA must be a full 40-character lowercase commit SHA"; exit 1; }
          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          ACTUAL_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<< "$PR_JSON")"
          [[ "$PR_STATE" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::Approval is stale. Current PR head is $ACTUAL_SHA; approve that exact SHA and dispatch again."; exit 1; }
          gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"$REPOSITORY_OWNER\" and .body == \"/approve-ci $EXPECTED_SHA\") | .id" \
            | grep -q . || { echo "::error::No owner approval comment exists for this exact SHA"; exit 1; }
          echo "Approved SHA verified: $ACTUAL_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Lint, test and build Android variants
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify SQLCipher JNI members survive release shrinking
        shell: bash
        run: |
          set -euo pipefail
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          test -s "$MAPPING" || { echo "::error::Release R8 mapping file is missing"; exit 1; }
          grep -Fq 'net.sqlcipher.database.SQLiteDatabase -> net.sqlcipher.database.SQLiteDatabase:' "$MAPPING" || {
            echo "::error::SQLCipher SQLiteDatabase class was renamed by R8"; exit 1;
          }
          grep -Fq 'long mNativeHandle -> mNativeHandle' "$MAPPING" || {
            echo "::error::SQLCipher JNI field mNativeHandle was removed, renamed, or changed in release output"; exit 1;
          }
          echo "Verified SQLCipher SQLiteDatabase and long mNativeHandle are preserved in the minified release mapping."
      - name: Run SQLCipher JNI smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nestnote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release APK for inspection
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nestnote-release-apk-inspection
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
