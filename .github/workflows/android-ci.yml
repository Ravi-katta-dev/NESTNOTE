name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit tests, debug build and test signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Generate temporary CI keystore and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          # This disposable key is for CI validation only. Never use it for production upgrades.
          STORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STORE_PASS"
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/nestnote-ci-test.jks" \
            -storetype JKS -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -alias nestnote-ci-test -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=NESTNOTE CI Test,O=Temporary Testing,C=US"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/nestnote-ci-test.jks" \
            --ks-key-alias nestnote-ci-test \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
            --out app/build/outputs/apk/debug/app-debug-ci-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug-ci-signed.apk
          rm -f "$RUNNER_TEMP/nestnote-ci-test.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nestnote-ci-signed-test-apk
          path: app/build/outputs/apk/debug/app-debug-ci-signed.apk
          if-no-files-found: error
  instrumentation-tests:
    name: Instrumentation and UI E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator"
      - name: Run emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
