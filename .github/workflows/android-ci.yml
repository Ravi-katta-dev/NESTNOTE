name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Keep a 70-second debounce for PR commit bursts; newer runs replace older runs per ref.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit tests, API 36 debug build and release compilation
    runs-on: ubuntu-latest
    steps:
      - name: Debounce pull request updates
        if: ${{ github.event_name == 'pull_request' }}
        run: sleep 70
      - uses: actions/checkout@v4
        with:
          # Check out the latest PR merge ref after debounce; otherwise use the triggering SHA.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Lint, test and build Android variants
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nestnote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release APK for inspection
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nestnote-release-apk-inspection
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
