name: Generate F-Droid Repo Keystore (Run Once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate dedicated repository keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fdroid
          cd fdroid

          # Generate fresh, strong credentials without printing them to logs.
          KEYSTORE_PASS="$(openssl rand -hex 32)"
          KEY_ALIAS="nestnote-repokey"
          KEY_PASS="$KEYSTORE_PASS"

          keytool -genkeypair \
            -keystore keystore.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=NESTNOTE Repo, OU=Development, O=Ravi-katta-dev, C=IN"

          # Create short-lived artifacts for the repository owner to download.
          base64 -w0 keystore.p12 > keystore.b64
          {
            printf 'FDROID_KEYSTORE_PASS=%s\n' "$KEYSTORE_PASS"
            printf 'FDROID_KEY_PASS=%s\n' "$KEY_PASS"
            printf 'FDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS"
          } > secrets.txt
          chmod 600 keystore.p12 keystore.b64 secrets.txt

          echo "=== SHA-256 repository signing fingerprint ==="
          keytool -list -v -keystore keystore.p12 -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" 2>/dev/null |
            grep -E 'SHA256:|SHA-256:'

      - name: Upload keystore and credential artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-keystore-secrets
          path: |
            fdroid/keystore.p12
            fdroid/keystore.b64
            fdroid/secrets.txt
          retention-days: 1
