name: Generate F-Droid Repo Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install fdroidserver
        run: |
          sudo add-apt-repository ppa:fdroid/fdroidserver -y
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Generate keystore
        id: gen
        run: |
          mkdir -p fdroid
          cd fdroid
          fdroid init
          echo "=== Base64 keystore ==="
          base64 -w0 keystore.p12 > keystore.b64
          cat keystore.b64
          echo ""
          echo "=== SHA-256 fingerprint ==="
          keytool -list -v -keystore keystore.p12 -storetype PKCS12 \
            -storepass $(grep keystorepass config.yml | cut -d'"' -f2) \
            -alias $(grep repo_keyalias config.yml | cut -d'"' -f2) \
            2>/dev/null | grep SHA256

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-keystore
          path: fdroid/keystore.p12
          retention-days: 1

      - name: Output base64 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-keystore-base64
          path: fdroid/keystore.b64
          retention-days: 1
