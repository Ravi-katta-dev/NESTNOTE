# CI runners provide 16 GB RAM. The Kotlin 2 (FIR) frontend needs real heap
# headroom for this codebase's large Compose functions: at the previous 2 GB
# default the data-flow analyzer thrashed and died with
# "OutOfMemoryError: GC overhead limit exceeded" in compileDebugKotlin /
# compileReleaseKotlin. Keep Gradle orchestration and Kotlin compilation
# separately sized and generous.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
